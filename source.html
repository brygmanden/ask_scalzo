@font-face{font-family:"Head-Bold";src:url("https://www.baristahustle.com/wp-content/themes/divi-child/assets/fonts/head/Head-Bold.woff2") format("woff2");font-weight:normal;font-style:normal;font-display:swap}

/* Ask Scalzo. Every rule is scoped to .asz-app so the app can sit inside another page.
   Layout: two-panel card, portrait panel left, conversation right; stacks on phones. */
.asz-app{--asz-bg:#f2f4f3;--asz-surface:#f4f4f4;--asz-ink:#192b2a;--asz-muted:#526661;--asz-line:#cbd2cf;--asz-line-soft:#e0e6e2;--asz-panel:#dce9e0;--asz-forest:#214b39;--asz-on-forest:#fff;--asz-on-forest-muted:#d2e2d8;--asz-focus:#225e45;--asz-button-ink:#f9f9f9;--asz-ink-filter:none;
--asz-head:"Head-Bold",sans-serif;--asz-text:"NoBH-Regular",sans-serif;--asz-text-bold:"NoBH-Bold",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .asz-app{--asz-bg:#111917;--asz-surface:#18221f;--asz-ink:#e3ece8;--asz-muted:#9fb2aa;--asz-line:#2f3d38;--asz-line-soft:#26332f;--asz-panel:#1f322a;--asz-forest:#2f6a51;--asz-on-forest:#f4faf7;--asz-on-forest-muted:#c3d8cc;--asz-focus:#7cc4a2;--asz-ink-filter:invert(1) brightness(.92);color-scheme:dark}}
:root[data-theme="dark"] .asz-app{--asz-bg:#111917;--asz-surface:#18221f;--asz-ink:#e3ece8;--asz-muted:#9fb2aa;--asz-line:#2f3d38;--asz-line-soft:#26332f;--asz-panel:#1f322a;--asz-forest:#2f6a51;--asz-on-forest:#f4faf7;--asz-on-forest-muted:#c3d8cc;--asz-focus:#7cc4a2;--asz-ink-filter:invert(1) brightness(.92);color-scheme:dark}
.asz-app,.asz-app *{box-sizing:border-box}
.asz-app{container:asz-app / inline-size;display:block;width:100%;height:auto;margin:0;padding:0;border-radius:6px;overflow:hidden;background:var(--asz-bg);color:var(--asz-ink);font-family:var(--asz-text);font-weight:normal}
.asz-app [hidden]{display:none!important}
.asz-app{font-size:16px;line-height:1.4;text-align:left;letter-spacing:normal;text-transform:none}
.asz-app :where(h1,p,blockquote,label,details,summary,span,div,form,section){border:0;padding:0;background:none;box-shadow:none;quotes:none;text-transform:none;letter-spacing:normal;font-style:normal;color:inherit;text-shadow:none}
.asz-app :where(h1,p,blockquote){margin:0}
.asz-app :where(img){max-width:none;border:0;box-shadow:none}
.asz-app :where(input,button){box-shadow:none;text-transform:none;letter-spacing:normal;line-height:normal}
.asz-title{font:normal 34px/1.15 var(--asz-head);margin:0 0 22px;white-space:nowrap;overflow:hidden}
.asz-card{width:100%;height:auto;display:grid;grid-template-columns:34% 66%;background:var(--asz-surface);border-radius:6px;overflow:hidden;box-shadow:0 15px 50px rgb(20 52 42 / .06)}
.asz-character{background:var(--asz-panel);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:end;padding-top:120px}
.asz-tag{position:absolute;top:26px;left:26px;right:26px;white-space:nowrap;overflow:hidden;z-index:1;text-transform:uppercase;letter-spacing:1.8px;font:normal 12px var(--asz-text-bold)}
.asz-portrait{border:0;background:none;width:100%;padding:0;margin:0;cursor:pointer;position:relative;color:inherit;font:inherit}
.asz-frames>img{display:block;width:100%;height:100%}
.asz-portrait:hover{transform:rotate(-1deg)}.asz-portrait:focus-visible{outline:3px solid var(--asz-focus);outline-offset:-4px}
.asz-frames{display:block;position:relative;width:min(100%,calc(340px * 720 / 678));max-width:100%;aspect-ratio:720/678;margin:0 auto;transform:translateY(-18px) scale(1.02);transform-origin:50% 100%}.asz-frames .asz-talk{position:absolute;inset:0;width:100%;height:100%}
.asz-tap{position:absolute;left:7.5%;top:19.3%;width:17.2%;line-height:0;pointer-events:none}.asz-portrait .asz-tap img{display:block;width:100%;height:auto;object-fit:fill;filter:var(--asz-ink-filter)}.asz-portrait .asz-tap .asz-tap-mob{display:none}
.asz-name{width:100%;background:var(--asz-forest);color:var(--asz-on-forest);padding:20px 26px}
.asz-name-title{font:normal 28px var(--asz-head);display:block;white-space:nowrap;overflow:hidden;margin-bottom:-6px}.asz-name-sub{font-size:14px;display:block;white-space:nowrap;overflow:hidden;margin-top:5px;color:var(--asz-on-forest-muted)}
.asz-content{padding:26px 26px 24px;min-width:0;display:flex;flex-direction:column}
.asz-app button,.asz-app input{font:inherit}.asz-app button{cursor:pointer}
.asz-app button:focus-visible,.asz-app input:focus-visible{outline:3px solid var(--asz-focus);outline-offset:2px}
.asz-label{font:normal 12px var(--asz-text-bold);letter-spacing:1.6px;color:var(--asz-muted);text-transform:uppercase}
.asz-result{min-height:195px}.asz-result .asz-label{margin:-8px 0 -10px}
.asz-quote{font:normal 27px/1.35 var(--asz-text-bold);margin:17px 0}blockquote.asz-quote{font-size:23.8px;line-height:1.25}
.asz-passage{font:normal 19px/1.55 var(--asz-text-bold);margin:18px 0}
.asz-source{font-size:14px;color:var(--asz-muted)}
.asz-result details{margin-top:12px;font-size:14px;line-height:1.5}.asz-result summary{cursor:pointer}
.asz-form{margin:auto 0 0;border-top:1px solid var(--asz-line-soft);padding-top:22px}
.asz-question-label{display:block;font:normal 16px var(--asz-text-bold);margin-bottom:12px}
.asz-input-row{display:flex;gap:8px}
.asz-input{width:100%;min-width:0;height:42px;margin:0;padding:0 14px;border:1px solid var(--asz-line);border-radius:9px;font-size:16px;background:var(--asz-surface);color:var(--asz-ink)}
.asz-ask{display:inline-flex;align-items:center;gap:8px;flex:none;background:var(--asz-forest);color:var(--asz-button-ink);border:0;border-radius:9px;padding:0 20px;margin:0}
.asz-ask-icon{display:block;flex:none}
.asz-suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.asz-suggestion{border:0;background:var(--asz-forest);color:var(--asz-button-ink);border-radius:6px;font-size:14px;padding:8px 10px;margin:0}
.asz-bump{animation:asz-bump .4s ease}@keyframes asz-bump{50%{transform:translateY(-8px) rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){.asz-bump{animation:none}.asz-portrait:hover{transform:none}}
@container asz-app (max-width:699.98px){.asz-title{font-size:28px}.asz-card{grid-template-columns:1fr}.asz-character{padding-top:96px}.asz-frames{width:min(100%,calc(230px * 720 / 678))}.asz-portrait{max-width:300px}.asz-tag{top:20px;left:22px;right:22px}.asz-tap{left:-7.8%;top:14.7%;width:26.6%}.asz-portrait .asz-tap .asz-tap-desk{display:none}.asz-portrait .asz-tap .asz-tap-mob{display:block}.asz-name{padding:16px 22px}.asz-name-title{font-size:24px}.asz-quote{font-size:24px}blockquote.asz-quote{font-size:21.1px}.asz-result{min-height:180px}}
</style>

const data={"sections": [{"title": "Software & bookkeeping", "keywords": "software pos square xero bookkeeping bookkeeper accountant accounting systems technology", "time": "00:01:00.240", "text": "software help you bring more tasks in-house? Yeah, look, I'd say it's invaluable. You really need to be doing your research there, finding... There's lots on the market now. Everyone's probably heard of Xero as your accounting, your sort of first accounting software platform, that's cloud-based. There's now multiple of them, and they all do similar jobs, but they're all quite unique and I think you just need to do your research. Same with your point of sales. Do your research before you open a cafe and go, \"Oh, this one works best for me because we're doing these kind of things.\" And they're all pretty user-friendly, but at a certain point, I'm sure it becomes necessary to bring in external help. Do you have an eye, sort of like a simple rule that you could give for, well, the wheels are falling off, now's a good time to bring in a bookkeeper or accountant at scale? Yeah. If you're doing things probably outside of a certain scale that is more than just your sort of mum and dad cafe, that is operating on a real cash-based kind of business where it's just in and out, I think anything more complicated than that, I would start looking at some support if you've got no experience whatsoever as a bookkeeper of any sort. Yeah. Yep. Definitely. That sounds like good advice. In terms of that software, what's your current recommendation or favorite platforms or software? I know you mentioned Xero. Yeah. Well, we used Xero for quite a long time, just as a user-friendly interface. It's quite easy to use for, like, bookkeepers can use it quite easily and efficiently, but it's also good for your business owner to be able to see the numbers and look at it at a quite an easy level. As businesses get more complicated, you would have to look at more complicated software. Yeah. But yeah, things like a Xero are usually quite easy, and easy to invoice, easy to pay people- Yeah ... do those sort of things. And POS, point of sale systems? Well, we currently use Square. Like I said, same with accounting software. There is lots of those kind of cloud-based point of sales now in the system. There's Lightspeed and a few others. Do your research. Once you've decided on where to go with that, probably commit to that one. It's not hard to change. No. But there is always a bit of work through the changeover. So if we were looking at it again now, would we have chosen Square? Maybe, maybe not. Right. It depends on the thing. And through the wholesale arm of Saint Ali, I'm sure you've seen a lot of cafes start and a lot of cafes end as well. In terms of decisions around this software, have you seen anyone make bad decisions or really good decisions, or is it just kind of like, comes out in the wash? I think the only bad decision is no decision, right? If people are just like, they've still got a shoebox with papers in it- Yeah ... and they're sort of trying to pay things by cash and not have a proper system"}, {"title": "Profit and cash flow", "keywords": "profit cash flow invoices receivables money payments profitable", "time": "00:03:57.600", "text": "set up where they're using proper software. But other than that, no. If they're getting good advice and they've got some sort of bookkeeper involved and things like that, that's credible, it's usually okay. All right, let's move on to financial reports cafe managers should understand. How does that sound? We've got the three main reports for a business of this type. We've got the P&L, we've got the balance sheet, inventory. The latter two are kind of mixed in ways. Which one of those do you think is the most important for a cafe manager to be looking at? Look, from an accounting point of view, the cafe manager needs to understand cash flow. So the cash flow statement is probably up there, which I don't think a lot of people spend a lot of time on. Yep. And that is really important. The P&L is great, you want to make a profit, but a profit doesn't exactly equal cash. If they're not generating that cash that's coming in and coming out, then you can be still generating a profit, but if you're not cash flow positive, you're going to run out of money pretty quickly. And what's the difference between being, like a P&L that has a positive number on it and being cash flow positive? What's actually the difference there? Yeah, good question. Yeah. A P&L is, yeah, if you're running a cafe where you may be running accounts for people, or people are running a tab of some sort, or you're invoicing for events or functions, and you're not getting that cash in, then you've already consumed those costs, and that's where people start falling into a cash flow negative effect. So you want to be able to be generating more cash coming in than cash going out. And sometimes, not everyone is going to know the ins and outs of a P&L, if they don't have"}, {"title": "Reading the numbers", "keywords": "reports revenue sales wages suppliers numbers costs", "time": "00:05:36.320", "text": "any sort of background in that. But they should be able to know, I can control my invoices, this is the cash that's coming in, and this is the cash that's going out. Yep. And if they can focus on that, that's probably the most important part. Cool. And do you see any really common mistakes that cafe managers make when they're looking at these various reports? Are there classics? Yeah. Probably a lot of it is top line sales. Everyone's like, \"Wow, look how much money we've made. That's great.\" Revenue. Yeah. Yeah. \"How's that? Look at those sales.\" Which is great, but yeah, you've got to be seeing what's consuming all that revenue and what's left at the end. Yep. And is there anything in terms of like-I know obviously cash flow statement, you want to have more cash coming in than going out. Of course. But is there anything that you think should be zoomed in on a little? If you're just glancing at a cash flow report other than that top-line number, is there anything that, or bottom line number, what are you looking at specifically when you're reading a cash flow report? Look, there's sort of two things. There's suppliers and there's wages. They're the biggest costs and for as long as I can remember with cafes, they've always been the major cost. So cost of goods sold and labor. So if you're keeping that down, and you're not holding on accounts receivable, if you've got money coming in, and not sitting on a lot of money that should be coming in that's not, then that's a big problem. Yep. Keep your accounts receivable small. Yes. Keep it as small as possible. Good advice. Yes. Thank you. And is there any number on, let's move to the P&L for a second. Is there any number on a P&L that you would see and"}, {"title": "Watching your ratios", "keywords": "ratios percentages benchmark labour labor cogs wages food costs", "time": "00:07:16.196", "text": "immediately think that's a red flag for a business? Yeah. Look, I usually work on percentages- Yep ... a lot. So I'll look at labor percentage and I'll look at cost of goods sold percentage. So, your food and beverage costs and your wages, they're the two I would keep that need to be at a certain amount. Yep. They need to be at a range, and if they're not there, they're the first things I'll flag. If they are there and you're not making a profit, then there's something serious going on that's hidden and you better find it quickly. Right. And I guess that is as much of a positive indicator as a negative indicator. If those numbers are correct- Yeah ... and they're in range- Yes ... you're probably doing well. Yes, correct. Maybe rent can come into it, but that's fairly fixed."}, {"title": "A cash buffer", "keywords": "buffer reserves bank savings months seasonal cash emergency", "time": "00:08:03.136", "text": "Yeah. Back to cash flow again. Yeah. Is there a general rule of thumb of how much cash you should keep in the bank as a small cafe? Look, as a dollar amount, that's a hard one to answer. I understand, yeah. But I'd probably say, I think you'd need to survive a month to probably two to three months, you'd need to survive to be able to say you're cash flow negative. Say you're cash flow negative for three months, you should be able to have enough cash to get through those two to three months. Okay. Right? A lot of cafes can be seasonal, of course, depending if you're out in the countryside. Yeah. They're very busy during the summer periods and not as busy during the winter periods or vice versa. You need to sort of stockpile for those sort of areas and factor that in. Yeah. So, yeah. And I guess if your business model involves more receivables in various ways, and then they don't come in, you need to be buffered for those. Yes. Like a cafe that's just doing takeaway lattes and there's nothing else happening in the business model, they can run a little leaner because their only expenditures are going to be wages, whereas events or larger invoice items- Of course, yeah ... yeah. Absolutely. And then other areas you'd have to look at is do you own everything? If you're leasing things- Yeah ... there's obviously those repayments that you might owe, some loan repayments or things like that. Yep. So the question is a hard one because it depends on the financial setup of the business and how much they're leveraged. Yep. Yeah. But you want to sleep well at night, maybe is a good- Yeah ... a good rule of thumb. Yeah. I'd want to be able to survive on two to three months- Okay ... worth of cash, yeah. That's enough. Yeah. Now let's maybe move on to some key ratios and benchmarks. Mm-hmm. The largest cost of a business is labor. Yes. Especially here in Australia, with the very strict labor laws in Australia. What is a comfortable labor cost percentage in your mind? That scale has moved a lot over the years as"}, {"title": "Labour and food costs", "keywords": "labor labour percentage wages benchmark cogs combined 70 kitchen 40 35", "time": "00:10:11.476", "text": "labor has increased a lot in value. This is going to be probably a little bit controversial. I don't really measure labor as a percentage on its own because every cafe setup is a little bit different. I measure labor percentage as a combined with the cost of goods sold. Okay. So it's actually a combined percentage that I train all my managers to work off. So they, yes, they might look at them individually and we usually say below 40, we say something like that. If you can keep it below 40% for a kitchen-based cafe. Okay. And for a non-kitchen-based cafe, below 35 is better. But overall, we're looking at around a 70% combined, below 70% combined of cost of goods sold and labor because it sort of works hand in hand. When there's a kitchen, obviously our food costs are lower. When you're buying everything in, the food costs are higher and the labor is lower because you've got less chefs- Got it ... and things like that. Yep. So they kind of work hand in hand. And I think this is a common thing where people are constantly trying to cut labor but not factoring in the style of business they're running, and they need to think of those things quite linked together. Yeah. And what if there's an owner in the mix? Is that going to change? If you're a really involved owner/operator- Mm ... do you think those numbers can be tweaked a little bit further or? Yeah. And it all depends how the owner treats themselves in the business. Are they paying themselves or are they just working and then hopefully making a profit and they'll take those profits later at the end of the week, or end of the month or when they actually make a little bit of money. That has a massive effect on labor cost, so that changes it- Yeah ... and skews it to their benefit."}, {"title": "Creating value", "keywords": "efficiency staff training value cutting costs labor labour", "time": "00:11:50.956", "text": "Yeah. Are there any operational decisions that have the greatest leverage for these numbers in your mind, apart from just rostering less people on? Yeah. And it's funny you say that- Yeah ... because I've sort of been trained to tell people that saving money is not just cutting costs. Yeah. It's creating value as well. I think the focus needs to be a lot more on the value of the products, and people are very confused that-Cutting labor is not ideal. It's just creating efficiencies within that labor. So making sure everything that's done with everything in mind, that the labor is well-trained and well-educated, that they're trying to create as much revenue as possible for the business. And once they start creating that mindset, you see a massive shift in the business, and you're actually able to increase labor. Okay. Yeah, maybe tell me more about that mindset. Do you talk to employees about the numbers? Yeah. And employees at all levels of the business? Mm. Because I know there's a few different management cultures and styles where they sort of firewall all the staff from"}, {"title": "Sharing the numbers", "keywords": "staff team people culture transparency numbers share employees", "time": "00:13:02.204", "text": "knowing about specific numbers or targets- Yeah ... in a hospitality business. But you think- No, absolutely. I came from a culture that was literally maybe the upper echelons maybe knew the numbers, maybe they even didn't. Knew the goals, knew the target, and everyone else just was on the ground, not knowing really the purpose of the roles. We changed that a lot over the last five years, I would say, and we got people a lot more involved in the numbers. And yeah, there was that little bit of fear going, \"Oh, are we giving too much information?\" Because that business culture in the past was you don't tell people how much you're making or what you're doing. You keep that a secret. And we found people started to understand the process a lot more and willing to help the process rather than not, they just go, \"Oh, well, this is what it is.\" It's more about, \"Oh, how can I improve on this?\" And we're like, \"Oh, is that all we're making? I thought we're making much more than that. Oh, tell me more and I can help solve the problem.\" And I- Or upsell or... Yep. Yeah. And they're now working with all the new staff on things like that, going, \"When people walk in the door, we need to sort of greet them and give them a great experience and create greater value and upsell more things and do these processes.\" And it's all coming from the ground up now, and it's created this incredible culture that helps grow your business and makes it a sustainable business in this future that we're going into. Awesome. Yeah. And I'm sure on the other side, it also helps them reduce wastage because they're feeling on the other side of that coin, \"Oh, this wastage will reflect these numbers that I now know about.\" Yeah. \"And I should be mindful about whether I'm throwing this milk out or if I'm-\" Yeah ... letting the stock go to waste or yeah, anything like that. Yeah, absolutely. Yeah. It's very much coming from a ground up rather than a top down, which makes my job a lot easier. Great. That's all I'm going to do. Speaking of top down, what about rent? Have you got any opinions about ratios or numbers, percentages for rent in a cafe?"}, {"title": "Rent", "keywords": "rent lease landlord increases cpi location", "time": "00:15:10.404", "text": "Yeah, look, rent's one that it's funny, once upon a time, you didn't look at it. It was a fixed cost. You'd be like, okay, you negotiate a rent deal, and it was usually pretty good. Now, it is something you really need to make sure you negotiate well from the start, especially if you're in metro areas, like everyone works off a market rent per square meter. Anything between 10 and 12% is sort of where it sits these days. 12% being the higher end. You try and get below that as much as possible. But if you can sort of sustain that, but you've got to keep in mind that rent agreements are usually 4%, 3% CPI increases every year. And something that's $100,000 a year, every year, a 4% increase, it goes up pretty quickly. Yep. So you've got to watch those things. For sure. Alright. So you are a new cafe manager, you've just been hired on the job. You've been dropped in. You have access to the software and the POS and Xero or whatever."}, {"title": "A manager\u2019s first checks", "keywords": "manager start first roster sales revenue food labor labour", "time": "00:16:17.564", "text": "What are the handful of numbers that you need to look at in the next five minutes to figure out what is actually happening in a cafe? Look, you still got to go to top-line sales. You've got to see what it's turning over, what the revenue is. Yep. So you go and look at that and the ebbs and flows of those sales over the week, over the days, over the hours. So you can already start then checking the labor and how the roster works. So then you're looking at the roster and going, \"Okay, well, why are that many people on there, that many people on there?\" So you can see savings in rosters. Basically, you're looking at the three big items, your food costs, your labor costs, and your sales. Yep. Right? They're the three things I would look at as a manager because they'd be really low-hanging fruit there that you'd be able to change things quickly, and that's what an owner would want to get out of a manager straightaway, going, \"Oh, well, good job you've done that.\" And then while you're there, then you start focusing on the details as you get into it. In terms of staffing and opening a cafe, there is a bit of old wisdom that says that you should be starting a cafe a little bit overstaffed. Do you subscribe to this? It's a double-edged sword, right? So there's two approach. I guess it depends on the style of business you're running. If you're a sort of a mom and"}, {"title": "Opening with the right team", "keywords": "opening staffing overstaff understaff new cafe", "time": "00:17:38.404", "text": "dad sort of cafe set up or just an owner/operator, and you've gone in there with, there's three of you and a couple of family members and a couple of staff, and you're extremely understaffed, I think perspective and the opinion of customers will be very different to if you're an established business that you've opened three or four cafes and you've opened a new cafe. They expect that to be top class from the very start. So overstaffing in some aspects is great. Understaffing can sometimes give you that sort of close family connection with the customers. Oh, trauma bonding. Yeah, trauma bonding. Trauma bonding. I've done both. I've actually, I've opened cafes both ways. Yep. And, yeah, I've lost a lot of sleep both ways. Yeah, great. So either way, you're going to lose a lot of sleep. All right. Moving on to costing and- Yes ... coffee and menu items."}, {"title": "Costing a menu", "keywords": "menu pricing price recipe recipes coffee latte food cost ingredients competitor market", "time": "00:18:30.936", "text": "Yes. So a lot of cafe owners I know look around the neighborhood, check how much a latte costs at all of the other businesses, and then go, \"All right, we'll match that.\" Mm. Is that how someone should be costing their menu? It's definitely not how I cost a menu. Okay. How do you cost a menu? Well, we use software. There's now software that can do this for you and can do it so accurately, which is great, which saves the 100 spreadsheets and Excel docs that we try and cost a menu, which is quickly outdated in three weeks when food costs change constantly. So we build those recipes, we put them into the software, it gives us a cost of that food, and then we give ourselves a target of, say, 24% or whatever it is, is the food cost, and that is what the sale price should be. If that sale price is ridiculous and is not market, then we look at that product, we look at that dish, and we go, \"How do we adjust it?\" Yep. Right? And it's like either do we think this dish is going to sell, or do we think this item's going to sell, or do we need to change the ingredients to make them a more affordable ingredient and then sell them for a reasonable price that does suit the market. So yeah, you're right, you still need to go around and look at what the market's selling it at because market is important. It always has been. But you can't be making it a loss, can't be selling it at a loss."}, {"title": "Involving the team", "keywords": "stakeholders chefs bar team decision pricing costing", "time": "00:19:56.826", "text": "Yeah. And obviously, there's a lot of different players in a maybe a small cafe, there's one person that's going to make that decision, and then a chain of cafes or a larger group, there's managers, and then there's finance people, back office, ivory tower, whatever you want to call it. Yeah. Who should be making those decisions, or should everyone be involved in making those decisions? I think everyone, all the relevant stakeholders need to be involved in that. So if it's beverages, then the bar team need to be the key senior people from that bar team need to sit down and go, \"Well, these are what it costs.\" If it's food, then the chefs, head chef, sous chef, need to be sitting down and going, \"Okay, this is...\" With finance or purchasing and going, \"This is how much it costs,\" and they're like, \"Oh, wow, didn't realize that was that. I can change these ingredients for these ingredients.\" Everyone can contribute to the process. But getting more people involved, you'll get the decision done quicker. We were talking about metrics that you do share with staff in a cafe. Is it also sensitivity of costings to wastage and things like that that you can communicate with them? So it's like if we throw a couple of mils of milk down the sink, that doesn't seem like much, but if you multiply it across every latte for the year, that's $20,000 or something- Yeah ... to the milk bill. Do you share that and communicate that, or how do you manage"}, {"title": "Learning from waste", "keywords": "waste wastage report punishment understanding", "time": "00:21:17.416", "text": "that? Yeah, we actually have wastage reports- Yeah ... in similar software that calculates all those sort of things. I think in the past there was these wastage reports that almost were used as a sort of a tool for punishment sort of thing, \"Oh, don't waste.\" But now we use it more as an understanding tool. So these guys will be like, \"Oh, wow. That adds up.\" Yeah. And they adjust their way of thinking and adjust their systems to minimize those wastes. So it's really good. Yeah. I understand you've been integrating a relatively new tool called Suppy."}, {"title": "Better data, better decisions", "keywords": "suppy software stocktaking inventory data sku purchase ordering supplier invoices recipes", "time": "00:21:53.536", "text": "Suppy? Suppy. Suppy. Yes. Yeah. I feel like the Mr. Bean with that one. Does that actually help? What's going on with that? Yeah. Yeah. Absolutely. So Suppy, look, it's like any software tool, any IT, any AI, whatever you put in, is what's going to come out. Garbage in, garbage out. Yeah. Garbage in, garbage out, right? Yep. So there was a lot of backend work there that we've spent a good six months doing, building the recipes, getting all our suppliers to order through the system, right? So this software technology basically takes care of the whole business comprehensively from a costing point of view. So it pulls the sales from the point of sale. We do the ordering through that system. So everyone, all the suppliers then send through their invoices, which hit that system directly and update the prices instantly of all our recipes. And it's aware of all the SKUs of every item that goes into- It's aware of all the SKUs. Yeah. Yes, as long as you put all the SKUs in. Yeah, so that's what I was going to ask- Yeah ... is the discipline around stock-taking and purchasing. Yeah. Needs to be- It needs to be thorough, yeah. Yeah. And there was a big change management sort of movement there that we had to create, and I got the key stakeholders on board, and they helped bring everyone else on board. But it's as good as the system can make it accessible. It's designed by IT people that have come from a hospo background. Yeah. So it's the perfect marriage that they've created, and they've made it accessible to phones because then chefs don't sit on a laptop. Yeah. No baristas don't sit on a laptop, right? So they go on their phone, they put their order in. Anyone in the whole business can put an order in. It can then go to their managers, who can then approve it at the end of the day. That can send off the order. Yeah, wow. So there's different levels, there's different layers. If I had it when I was on bar, I would've loved it. Yeah, I remember I used to text the milkman- Yeah ... at 5:30 PM- Those sort of things, yeah ... for tomorrow's milk delivery. Yeah. So you just have like- Very different times. Very different times. Like all the section chefs, all the chef de parties will go and do their section, put their order into Suppy, either by supplier or by product to order. Oh, so they don't need to know the supplier. They don't even know the supplier. Yeah. So they can do it by product. They can go, \"I need three kilos of this.\" The head chef goes through it and he's like, \"Yep, cool. Actually, we've got some of this. I'll cancel that.\" Correct. \"I'll update that\"- Wow ... \"and send it all off.\"And then all those invoices come straight back into the system. If the price of avocados have gone up, our avocado on toast dish cost goes up instantly. Yeah. And it flags with us when our costs are too high. Nice. It just takes that, it's that lead accounting and that lead approach rather than that lag approach. Yes. Yeah. Which is- Stale data ... yeah. Yeah. Like finding out six weeks later that we're losing money on a dish where we can"}, {"title": "The hidden cost of waste", "keywords": "waste wastage eggs bread poaching crumbs chef", "time": "00:24:50.572", "text": "find out in a couple of days. Yeah. And yeah, what have been some of the insights that you've gained from using software like this? Were there any like- Yeah ... oh my God moments? There were. Like with the, yeah There were some oh my God moments, and it's things that you probably should've known, and it's like, yeah, of course. You'd be like, \"Yeah, of course, John, I should've known that.\" Yeah. But it's like things on bread, and eggs, right? The two biggest products that you use in a cafe, right? Go figure. There was a massive variance. And it's just like poaching eggs, right? Every time you were poaching an egg, you'd have to drop a third one in just in case one of those poached eggs didn't work. Yeah. And so over the course of a month, it was something like $1,500 to $2,000 in wastage of poached eggs because we were over-poaching. So chefs have now gone, \"Oh, let's adjust that.\" And bread, the extra slice here or an extra slice there or the- The half slice ... the half slices. Yeah. Yeah. They've realized that was wastage, so now they're turning them into crumbs for other dishes. And that's all coming from the data, but it's coming from the chefs making those decisions, seeing the data. It's not even coming from me, going, \"How can we fix it?\" They're coming to me going, \"This is how I fixed it,\" which is amazing. Nice. Yeah. That's incredible. Yeah. I would've loved that software. Oh. It was, yeah. All right. Let's move on to tax basics. Yeah. Now obviously our audience at Barista Hustle is very international, so I don't want to focus too myopically on Australian tax law."}, {"title": "Buying with purpose", "keywords": "tax deductions deduct dishwasher equipment buying purchase accountant", "time": "00:26:20.252", "text": "Yeah. But deductions. Yes. Can I just buy stuff and deduct it? Look, a lot, yes. But not everything. Okay. Give me a rule of thumb. Look, your day-to-day utensils that you use on a regular basis for service, you would say are mostly tax deductible, or your food and beverage purchases will be tax deductible. Everything that generates revenue on a day-to-day basis you could say is tax deductible, right? Your big items, like you're buying a new oven, that's not immediately tax deductible. That'll be deducted over- It's an asset ... it's an asset. Yeah. That's right. Go see a balance sheet, go see a P&L. Yeah. And I see a lot of small business owners freaking out at end of financial year because they've got all this money, hopefully, and now they're trying to spend it on things. Is that wise? Should you be rushing out to buy stuff so that you pay less tax before the end of a financial year? Or is that- Look, I think every business structure is a little bit different. Yeah. And that's the one you'd probably go to your accountant before, and which is what we do. I go to my accountant in sort of May, and go, \"This is where we're sitting at the moment. Is there anything I should look at?\" And they're going, \"Oh look, you could get some serious tax benefits if you need to purchase it,\" right? Yeah. I wouldn't be purchasing for the sake of purchasing. But like, hey, you've got a dishwasher that's been sitting in your cafe for 10 years, and it's done a good job, and it's come to its end of its life, and you'd probably get some tax breaks- Yeah ... in June if you bought one now. Sure. Yeah. Definitely get the benefit there. Yeah. But don't go buy a dishwasher and leave it in your storage for five years. Okay. That's fair. I'm sure everyone who knows a handful of cafe owners or stories about cafes knows that a fair few venues have been sunk"}, {"title": "Setting money aside", "keywords": "gst vat tax superannuation separate account obligations", "time": "00:28:13.472", "text": "by not keeping track of, it could be VAT or GST or sales tax or employee tax or superannuation, 401 , those sorts of things. How should a cafe owner think about those? Should they just be on top of it from day one, calculating everything properly? Or I know a lot of people are just like, \"Oh, I'll figure that out later.\" What's the advice here? Yeah. Look, I've seen people do it a few different ways. Some people really don't want to think about it, and I understand that. And so what they do so they don't get caught out, they actually have a separate bank account where they just move that, like our GST or VAT in Australia is 10%, they move it into another account, right? And it just sits there, and it keeps, and then they know. Can't touch it. They know, and they don't look at it. They don't look at it because it's not in their bank account, their everyday bank account. They look at their everyday bank account, and they know they can- Spend ... spend that or use that for purchases, and that's sitting on the side. That's definitely one way to do it. I always look at our P&Ls are always obviously without the GST or VAT, and that's how we look at sales over expenses. So it doesn't have the VAT, but it does have the super or the 401 . So then you know that they're your real numbers at the bottom. Yeah. But yeah. There's real simple ways to do it. Just create a separate account and move the money over there. That was a very simple idea. Yeah. Yeah. People prepay and just pay you in installments, and they know that that much money's going straight to the ATO every week, every month. Yeah. Nice. And obviously this company formation and things like that is very different according to different countries, but you were telling me an anecdote before about whether you should set"}, {"title": "Choosing a business structure", "keywords": "structure trust company business goals sell legal", "time": "00:29:59.412", "text": "up a company as a trust or as a proprietary limited company, which would be like in the US equivalent of an LLC or- Yeah ... a sole trader, or I don't know exactly what the words are. But you said that your accountant just would give you advice, and then five years later it would change. Yes. Correct. Yes. So don't worry about it? Oh, look, I wouldn't say don't worry, but yeah, policies change all the time. Government policies change, and they'll always try and close up loopholes wherever they think there's people taking too much advantage of situations.But at the end of the day, yeah, go check for legal advice. Ask them what's the best setup. But it's also, I think what I've learned the most is understand the life of your business. What are you wanting to do? Are you wanting to open a cafe and live the rest of your life running the cafe? Because that's a different business setup and structure to going, \"Hey, I want to open a cafe and I want to sell it for a profit in five years.\" Yep. All right. So, and your advice from legal on that would be very different. Yep. All right, let's move on to cash handling and reporting. Mm. So let's say you've got trouble with a till, a cash"}, {"title": "Cash and customers", "keywords": "cash cashless customers digital card till", "time": "00:31:07.884", "text": "register not settling at the end of the day. Does that even happen anymore? No. You mean cash? Yeah, cash. Oh. Does that- What's cash? What's cash? Is there still accuracy problems anymore or is that just like a thing of the past? Oh, look, yeah, there's still minor accuracy problems, but yeah, the cash is just so low, especially in Australia. We're very much a card-based country these days that it varies very little and it's very quick to track these days just due to the volume- Yeah ... of cash there is. If you could make Saint Ali cashless without making anyone angry, would you do it? Probably not, no. Yeah. I think just being from the generation I'm from, it's just- Oh, yeah ... it'd be sad. Okay. It'd be sad if we got to that place in the world. Okay. That's good. I appreciate that. Yeah. Yeah. It's more for the customer. We still have those beautiful people that they come in, have their coffee, and they pay with their $10 note, and they just leave, and they're happy. And I'm just like, they're in a world that is not digitalized, and I still love that. I love that. You know? Cash is king. Yeah. And well, I guess seeing as how cafes are so digital and cashless now, what's the modern equivalent of fingers in the till? Is it like sneaking food, or"}, {"title": "Keeping digital assets safe", "keywords": "security cybersecurity passwords password hack theft", "time": "00:32:28.744", "text": "have you ever had any troubles with this lately since going mostly cashless? Yeah, look, and I think there's always going to be that. I don't think you can... You're in a food and beverage business. There's always going to be the occasional, have an extra snack here or a coffee there, or things like that. And you've got to factor that into the business. But yeah, I think the bigger issue is probably more from a cybersecurity kind of point of view, which something you wouldn't have thought about 10, 15 years ago, for a cafe anyway. You're going to get hacked. Right. Yeah. Ransomed. Yeah. Yeah. But yeah, I think it's part of the society we live in now that you've got to sort of keep tight security on your assets, and your biggest asset is cash, and that's going through digitalized services that you've got to watch. Right. So get a password manager is what you're saying? Yeah, password manager. Yeah. Okay, good. Or a YubiKey or something. Yeah. All right, back to cash flow for a second."}, {"title": "Getting the core right", "keywords": "growth bankruptcy insolvent cash flow fail expansion slow", "time": "00:33:33.124", "text": "Obviously, without positive cash flow, a cafe can become insolvent very quickly. Mm. What are some of the reasons that you've seen over the years that cafes have gone bankrupt and become insolvent? I think the biggest one is they focus on growth very early in the business cycle, which is great, but when they're purely focusing on growth and not on the day-to-day running of the business, it's when it usually falls over. So throwing money at things constantly is the perfect red flag for you to go, \"Okay, guys. Slow it down. Let's get the core right. Let's get the business running right. Let's get money coming in the door, and then slowly build from there.\" Everyone wants the quick win, and I think sometimes the slow burn is what the better option is. Yeah. Because I have heard a lot of cafe owners talk about things as loss leaders. Yeah. And sometimes a lot of things in the business are a loss leader. Maybe too many things are a loss leader. Too many loss leaders. No. Yeah. They've got to lead something. No. Yeah. All right, so now that we're onto running out of money,"}, {"title": "Borrowing and partners", "keywords": "borrow loan financing lender bank debt partners interest", "time": "00:34:48.824", "text": "borrowing and financing, getting more money, funding sources, have you seen anything that works better, works terribly? Rules of thumb? Parents are usually the best. Yeah. Yeah. Most forgiving. Yeah, lowest interest rates possible. Excellent. But yeah, look, I know obviously a lot of people set up cafes with partners together, and that's not always a bad way. Getting to know your business partner well, though, is probably really important. Mm. Making sure you've got the right person that you're going into business with. So investing that way is not a terrible idea. Things can go wrong, of course. Yep. Banks, obviously it's a secure form, but you need to make sure you repay them, right? Obviously and yeah, it is a thing. Who knew? Yeah. Absolutely. But it's probably more the percentage, right? Yeah. At what point is it too far, like 20%, 30%? If I had to get more than half the business value in a loan, I'd be a little bit nervous. And when you say business value, what do you mean by that? Oh, well, if I was starting a new business and the business, say the sale value of the business. So the business was valued at, say 150 or 200 grand. Yep. And I needed to get a loan of 100. I'd be not sleeping at night. Okay. Yeah. Good to know. And obviously there's banks, but there's also a lot of neobank lenders that are sort of based on your cash flow or based on your takings, and I have heard them offering smaller businesses loans, but at very high interest rates. I'd steer away from them- Steer clear. Right ... as much as possible. And I get them in my feeds and emails all the time going, \"Hey, $20,000.\" Only 15%. Yeah. Only 18% APR. Yeah. Yeah. Crazy things like that, and it's like, yeah, try and stay away if you can. And yeah, just try and slow burn. Just slow it down, and use the money that you've got if you can. Mitigate as much loan as possible."}, {"title": "Selling a cafe", "keywords": "sell sale value valuation ebitda exit", "time": "00:37:15.064", "text": "Have you seen many cafes sell successfully? Recently? In the last three years, five years. Yes. Yeah? Yeah. They've done well, and they've sold. We're not in a golden era of cafe sales the way they used to be, where people would get five to six times the value of the business. Now I would say it's more of a two to three times. On EBITDA? Yeah. Yep. Yeah. And two to three times is still pretty good. But yeah, it's more about the future value of the business now. People are looking at going, \"Oh, well, how much can this really turn over?\" Or, \"How much can I grow the business further?\" when they're looking to sell. But yeah, I've seen a few, but I've seen probably a lot more sell at not a good rate. More of the owner trying to get out- Yeah ... and just be done with it rather than pull the profit. Yeah. Correct. Yeah. Let's just touch on employment and contractor rules for a"}, {"title": "Employment costs", "keywords": "employment employees contractor entitlement super work cover", "time": "00:38:20.984", "text": "second. There's been a lot of changes in Australia lately- Mm ... around the difference between an employee and a contractor. Have you had any troubles with that, experience with that? What's the current status there for you in a cafe? All our team are employees. I believe that contractors now are treated like employees regardless. I think it's just easier to either keep them as employees. I think it was trying to avoid the super issues and the work cover issues and all the extra payments on top of that. One way or another, you're going to have to pay it. So I think it's just easier to keep them fully employed by you, and then you can pay out all the entitlements that you need to pay. It's one of those ones that's a cost you just can't avoid. Just cost of doing business. The cost of doing business. Correct. Okay. Fair enough. Yeah."}, {"title": "Walking through a P&L", "keywords": "p&l pnl profit revenue earnings cogs gross net ebitda expenses gst depreciation", "time": "00:39:14.384", "text": "I know that profit and loss, cash flow statements, they can be a bit intimidating sometimes. Mm. Of course. And I even stuff up some of the words sometimes in my own business. So can we just quickly go through, like profit isn't earnings, and revenue isn't earnings, and earnings isn't... There's all these different words- Yeah ... and they sort of mean subtly different things. So maybe we can work our way down a P&L. Yeah. Happy to. So we're starting with revenue. Yeah. That's the money that comes in the door. Top line sales, revenue, the money that comes in the door. Yep. The only difference there, you probably go to ex GST, including GST. So I think that's a big one that managers need to understand, like are you showing me the sales that include GST? Because that GST really isn't part of your overall sales. That's got to go to the taxman. So we delete that out. Delete that out. And then right underneath that, we're getting into cost of goods. Yeah. COGS. So COGS, cost of goods sold. So that's the purchases of everything that we buy that we are going to sell. So the food, the milk, the coffee, all those basic things. That's not the knives, the forks, the plates, the glasses. The rent. The rent. It's not the rent. It's not any of those things. Yeah. It can be, depending on the way it's treated, it can be other consumables like takeaway boxes. Yep. Some people use the packaging usually will fall into cost of goods sold as well. Yep. So those things will give the cost of goods sold, which gives you the gross profit. The sales minus the cost of goods sold, you'll be sitting at your gross profit. That's gross profit, and then we deduct everything else that's going on in the business. Yeah. So OpEx, operating expenses. Operating expenses. Rent, bank revaluations. Yeah. Taxes and things. Membership fees, all those things. Yep. And then obviously the big one, labor in there as well. Yep, labor. And then at the bottom we've got, is that earnings? Is it profit? What have we got then? Well, it depends. If you're getting a full accountant P&L- Yep ... you'll have your earnings, your EBITDA, so your earnings before interest, tax, depreciation, and amortization. That's just a big word for that's your profit minus all your accounting expenses that are not real cash expenses. Things that you can't really control or- Yeah. Things like depreciation- Okay ... which is just going to be decided by the accountant based on sort of government legislation and things like that. So the earnings is probably where you sort of sit at for a manager point of view. There's not too much you need to know in regards to tax and that sort of stuff. The things that you can't control. Yeah. Of course. But yeah. And then at the very bottom, you'll have your earnings before tax. And then when a cafe owner is talking about profit- Yes ... generally what they would probably be describing is the money they actually took out of the business into their own account, right? Yes. Yeah. Correct. What I actually got at the end of the day. Yes. Yeah. Yeah. And the thing with cafes, they're very much the profit and loss, and that's probably why a lot of businesses don't look at cash flow statements that much in cafes because a lot of the P&L is very much a cash-based P&L, unlike other businesses that do have a high accounts receivable and a high accounts payable, so not all of it is. A lot of it's not cash. Yep. So the P&L and the cash flow statement can be very different. In cafes, they should be relatively close, you'd hope. And just to clarify, net profit, where does that fit in? That's at the bottom there. So the net profit- Yeah ... is all your revenue minus your cost of goods, minus your labor, minus your operating expenses, your rent, and your utilities and everything. So that can be subbed in for EBITDA or- Yeah, that can be subbed in. And net profit can be used in a few different ways. It can be before the tax, it can be after tax, but yeah, it's the bottom line at the end of the day. Yep. And hopefully there is some. Yes. Good. And hopefully it's positive. Excellent."}, {"title": "Look after your people", "keywords": "golden rule people staff team care", "time": "00:43:04.604", "text": "All right. And finishing up, do you have one golden rule for cafe managers to finish off with? Something that you think they should just really keep on top of? Look after your people. The numbers are the result. The people are what makes it happen. So if you care for your staff and you grow your staff and your team, the rest will follow. Incredible. Thank you, John. No problem"}], "quotes": [{"title": "People first", "time": "00:43:13.544", "text": "Look after your people. The numbers are the result. The people are what makes it happen. So if you care for your staff and you grow your staff and your team, the rest will follow."}, {"title": "Get the core right", "time": "00:34:12.404", "text": "the perfect red flag for you to go, \"Okay, guys. Slow it down. Let's get the core right. Let's get the business running right. Let's get money coming in the door, and then slowly build from there.\""}, {"title": "The slow burn", "time": "00:34:24.265", "text": "Everyone wants the quick win, and I think sometimes the slow burn is what the better option is."}, {"title": "Use what you have", "time": "00:37:06.624", "text": "slow burn. Just slow it down, and use the money that you've got if you can."}, {"title": "Choose your partners", "time": "00:35:19.184", "text": "Getting to know your business partner well, though, is probably really important."}]};
const result=document.getElementById('asz-result'),q=document.getElementById('asz-q'),portrait=document.getElementById('asz-portrait');let index=0;

function pearl(){const p=data.quotes[index++%data.quotes.length];result.innerHTML=`<div class="asz-label">${escape(p.title)}</div><blockquote class="asz-quote">“${escape(cap(p.text))}”</blockquote>`;portrait.classList.remove('asz-bump');void portrait.offsetWidth;portrait.classList.add('asz-bump')}

function words(s){return s.toLowerCase().replace(/labour/g,'labor').replace(/pricing|priced/g,'price').replace(/staffing/g,'staff').match(/[a-z0-9]+/g)?.filter(x=>!stop.has(x))||[]}
function ask(){const question=q.value.trim();if(!question)return;if(/^(give|tell|provide|show).*(quote|pearl)|^quote$/i.test(question)){pearl();return}const terms=words(question);const ranked=data.sections.map(s=>{const ks=words(s.keywords+' '+s.title);return {s,score:terms.reduce((v,t)=>v+(ks.includes(t)?4:0)+(words(s.title).includes(t)?2:0),0)}}).sort((a,b)=>b.score-a.score);if(!terms.length||!ranked[0].score){result.innerHTML='<div class="asz-label">Outside the interview</div><p class="asz-quote">I couldn’t find a clear match in this interview.</p><p class="asz-source">Try asking about cash flow, staff, menu costing, waste, or running a cafe. Lesson text hasn’t been added to this prototype yet.</p>';return}const s=ranked[0].s;const cues=s.text.split(/(?<=[.!?])\s+/);const scored=cues.map((text,i)=>({text,i,score:words(text).filter(t=>terms.includes(t)).length})).sort((a,b)=>b.score-a.score);const excerpt=cues.slice(Math.max(0,scored[0].i-1),scored[0].i+3).join(' ');result.innerHTML=`<div class="asz-label">Relevant interview passage · ${escape(s.title)}</div><p class="asz-passage">${escape(cap(excerpt))}</p><details><summary>Read the full passage</summary><p>${escape(cap(s.text))}</p></details>`}
const talkA=document.getElementById('asz-talk-a'),talkB=document.getElementById('asz-talk-b');let tick=null,stopAt=0,frame=0;

document.getElementById('asz-form').addEventListener('submit',e=>{e.preventDefault();ask()});
